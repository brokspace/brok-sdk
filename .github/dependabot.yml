version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # `@1.85` selects the MSRV toolchain; it is not an action version.
      - dependency-name: dtolnay/rust-toolchain
